name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    # Also trigger on version tags (e.g., v1.0.0)
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  # github.repository is always in the format "owner/repo" (e.g., CelineBoutinon/FiligraneMalin)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Grant necessary permissions to push to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # This token is automatically generated by GitHub; no manual setup required
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Generates tags for the main branch and any semantic version tags you create
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The ultimate DE flex: Use GitHub Actions caching to make future builds blazing fast
          cache-from: type=gha
          cache-to: type=gha,mode=max